<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Twinkal Tic-Tac-Toe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <h1>Twinkal Tic-Tac-Toe</h1>

    <div class="controls">
      <label>
        Mode:
        <select id="mode">
          <option value="pvp">2 Players</option>
          <option value="ai">Vs Computer</option>
        </select>
      </label>
      <label id="difficultyLabel" class="hidden">
        Difficulty:
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
    </div>

    <div class="scoreboard">
      <div class="score"><span>X</span><strong id="scoreX">0</strong></div>
      <div class="score"><span>Draws</span><strong id="scoreDraw">0</strong></div>
      <div class="score"><span>O</span><strong id="scoreO">0</strong></div>
    </div>

    <div id="status" class="status"></div>
    <div id="board" class="board"></div>

    <div class="actions">
      <button id="reset" class="reset">Restart</button>
      <button id="resetScores" class="reset secondary">Reset Scores</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
